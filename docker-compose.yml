services:
  frontend:
    container_name: koala_frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NODE_VERSION: ${NODE_VERSION}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT}:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    env_file:
      - .env
    environment:
      - NODE_ENV=${NODE_ENV}
    stdin_open: true
    tty: true
  
  backend:
    container_name: koala_backend
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        PYTHON_VERSION: ${PYTHON_VERSION}
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT}:5000"
    volumes:
      - ./backend:/app
    env_file:
      - .env
    environment:
      - FLASK_ENV=${FLASK_ENV}
    depends_on:
      - postgres

  postgres:
    image: postgres:${POSTGRES_VERSION}
    container_name: koala_postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_HOST_AUTH_METHOD=trust
    volumes:
      - ./data/postgres:/var/lib/postgresql
    ports:
      - "${POSTGRES_PORT}:5432"

volumes:
  frontend_node_modules:
